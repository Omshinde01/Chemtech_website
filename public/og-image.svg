<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#071523" />
  
  <!-- Subtle Industrial Grid Background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(59, 130, 246, 0.07)" stroke-width="1"/>
    </pattern>
    <linearGradient id="primaryGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="1000" cy="150" r="320" fill="url(#primaryGlow)" filter="blur(60px)"/>
  <circle cx="200" cy="500" r="280" fill="url(#primaryGlow)" filter="blur(60px)"/>

  <!-- Border accent -->
  <rect x="30" y="30" width="1140" height="570" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" fill="none"/>

  <!-- Badge -->
  <g transform="translate(100, 110)">
    <rect width="280" height="38" rx="6" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
    <circle cx="20" cy="19" r="4" fill="#38BDF8"/>
    <text x="36" y="24" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">PRECISION MATERIALS LEADER</text>
  </g>

  <!-- Main Brand Title -->
  <text x="100" y="220" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" letter-spacing="-1">
    CHEMTECH <tspan fill="url(#textGrad)">SPECIALTY</tspan>
  </text>

  <!-- Tagline -->
  <text x="100" y="280" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="600" letter-spacing="-0.5">
    High-Performance Industrial Chemical & Material Solutions
  </text>

  <!-- Description -->
  <text x="100" y="340" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Investment Casting Waxes • Release Agents • Industrial Adhesives • Protective Metal Coatings
  </text>

  <!-- Features / Value Props Pills -->
  <g transform="translate(100, 420)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="48" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(59,130,246,0.3)"/>
    <text x="24" y="30" fill="#60A5FA" font-family="sans-serif" font-size="15" font-weight="600">✓ Precision Pattern Wax</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="220" height="48" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(34,211,238,0.3)"/>
    <text x="264" y="30" fill="#22D3EE" font-family="sans-serif" font-size="15" font-weight="600">✓ Advanced Demolding</text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="230" height="48" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(16,185,129,0.3)"/>
    <text x="504" y="30" fill="#34D399" font-family="sans-serif" font-size="15" font-weight="600">✓ Rubber-to-Metal Bond</text>

    <!-- Pill 4 -->
    <rect x="730" y="0" width="220" height="48" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(245,158,11,0.3)"/>
    <text x="754" y="30" fill="#FBBF24" font-family="sans-serif" font-size="15" font-weight="600">✓ Corrosion & Heat Barrier</text>
  </g>

  <!-- Bottom Details -->
  <line x1="100" y1="520" x2="1100" y2="520" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="100" y="555" fill="#64748B" font-family="sans-serif" font-size="15">chemtechspecialty.com • Nashik, Maharashtra, India • Pan-India & Global Supply</text>
  <text x="1100" y="555" text-anchor="end" fill="#38BDF8" font-family="sans-serif" font-size="15" font-weight="600">ISO-Standard Quality • Direct Technical Support</text>
</svg>
